services:
  app:
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - ${APP_AUDIO_MOUNT:-worktree_audio:/app/audio}

  download-worker:
    volumes:
      - ${WORKER_AUDIO_MOUNT:-worktree_audio:/app/audio}

  # Library indexing (#277) reads the same reference audio the worker writes,
  # so it has to follow it into the worktree volume or it would fingerprint the
  # main checkout's library.
  fingerprint-service:
    volumes:
      - ${WORKER_AUDIO_MOUNT:-worktree_audio:/app/audio}:ro

  fingerprint-set-worker:
    volumes:
      - ${WORKER_AUDIO_MOUNT:-worktree_audio:/app/audio}:ro

volumes:
  worktree_audio:
