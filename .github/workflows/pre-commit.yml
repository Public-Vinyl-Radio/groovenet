name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-npm
        with:
          cache-dependency-path: |
            package-lock.json
            my-collection-search/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Build shared contracts and client
        run: |
          npm run build --workspace=@groovenet/contracts
          npm run build --workspace=@groovenet/client

      - name: Install web dependencies
        run: npm ci --prefix my-collection-search

      - uses: pre-commit/action@v3.0.1
