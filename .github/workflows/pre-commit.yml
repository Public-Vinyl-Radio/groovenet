name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The eslint hook shells out to the local install, so
      # my-collection-search's node_modules has to exist.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: my-collection-search/package-lock.json

      - name: Install web dependencies
        working-directory: my-collection-search
        run: npm ci

      - uses: pre-commit/action@v3.0.1
