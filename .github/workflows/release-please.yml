name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # A PAT (not the default GITHUB_TOKEN) is required so that the
          # release tag this action creates will trigger docker-publish.yml.
          # Tags/commits made with GITHUB_TOKEN do NOT trigger other workflows.
          # Create a fine-grained PAT with Contents: read/write + Pull requests:
          # read/write on this repo, and save it as the RELEASE_PLEASE_TOKEN secret.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Its own job so a failure here cannot skip install-bundle. The helper's unit
  # test runs in changes.yml (with the other .github/scripts tests), not here.
  mark-latest:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Mark the app release as latest
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: node .github/scripts/mark-app-release-latest.mjs

  # An app release (vX.Y.Z) gets the install bundle that install.sh downloads.
  # release_created is the root package's output, so a CLI or client release
  # does not trigger this; install-bundle.yml also rejects any prefixed tag.
  install-bundle:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/install-bundle.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
