name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 7 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      # JavaScript/TypeScript analysis does not require a separate build step here.
      # If Swift scanning is added later, use a separate macOS job with build-mode:
      # manual and an explicit xcodebuild invocation.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
