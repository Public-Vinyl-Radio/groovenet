name: Build and Publish Docker Images

on:
  pull_request:
  push:
    branches:
      - main
    # Semver releases only (vX.Y.Z). Timestamp tags (v2026...Z, no dots) from the
    # release-localbuild escape hatch intentionally don't trigger a promote.
    tags:
      - "v*.*.*"

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  affected:
    uses: ./.github/workflows/changes.yml
    secrets: inherit

  # Publishing gate: main images require lint + tests; PR builds run in parallel.
  # Skipped on release tags — those promote already-tested images (see promote).
  test:
    # PRs run Test directly, preserving its existing check names.
    if: github.event_name == 'push' && github.ref_type != 'tag'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/test.yml
    secrets: inherit

  changes:
    needs: affected
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      webapp: ${{ needs.affected.outputs.webapp }}
      essentia: ${{ needs.affected.outputs.essentia }}
      ga_service: ${{ needs.affected.outputs.ga_service }}
      download_worker: ${{ needs.affected.outputs.download_worker }}
      fingerprint_service: ${{ needs.affected.outputs.fingerprint_service }}
      force_all: ${{ needs.affected.outputs.force_all }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      should_push: ${{ steps.meta.outputs.should_push }}
      platforms: ${{ steps.meta.outputs.platforms }}
      release_sha: ${{ steps.meta.outputs.release_sha }}
    steps:
      - name: Resolve image tag / push policy
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          # Decide the immutable image tag and whether to push:
          #   - PR              -> pr-<number>, build only (no push)
          #   - tag push (v*)   -> <tag> (e.g. v1.2.0), published release
          #   - main branch push-> sha-<short>, tested candidate image
          # Homelab is amd64-only, so we build a single arch (no slow QEMU arm64).
          platforms="linux/amd64"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            image_tag="pr-${{ github.event.pull_request.number }}"
            should_push=false
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            image_tag="${{ github.ref_name }}"
            should_push=true
          else
            image_tag="sha-${GITHUB_SHA:0:7}"
            should_push=true
          fi
          # The candidate-image tag for this commit (built on the main push),
          # which a release tag promotes instead of rebuilding.
          release_sha="sha-${GITHUB_SHA:0:7}"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "should_push=$should_push" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  build-webapp:
    needs: [changes, test]
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      (github.event_name == 'pull_request' || needs.test.result == 'success') &&
      github.ref_type != 'tag' && (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.webapp == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      SHOULD_PUSH: ${{ needs.changes.outputs.should_push }}
      IMAGE_TAG: ${{ needs.changes.outputs.image_tag }}
      PLATFORMS: ${{ needs.changes.outputs.platforms }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"  # ghcr requires a lowercase repository name
          tags="ghcr.io/${owner}/webapp:${{ env.IMAGE_TAG }}"
          if [[ "${{ env.SHOULD_PUSH }}" == "true" && "${{ env.IMAGE_TAG }}" == v* ]]; then
            tags="${tags}"$'\n'"ghcr.io/${owner}/webapp:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        if: env.SHOULD_PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build webapp
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./my-collection-search/Dockerfile
          # Without this, buildx builds the last stage in the Dockerfile
          # (migrator), producing an image that exits 0 and restart-loops.
          target: runner
          # runner builds and verifies Storybook before packaging public assets;
          # release tags promote this same candidate bundle without a host build.
          # Loaded locally (not pushed yet) so the smoke test below can run it
          # before anything reaches the registry; push is a separate step,
          # gated on that smoke test passing. buildx can't push and load in
          # the same invocation, and amd64-only (this repo's only platform)
          # is what load requires anyway.
          push: false
          load: true
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=webapp
          cache-to: type=gha,mode=max,scope=webapp
          build-args: |
            OPENAI_API_KEY=dummy
            DISCOGS_USER_TOKEN=dummytoken
            DISCOGS_USERNAME=dummyusername
            DISCOGS_FOLDER_ID=dummyfolderid
            APPLE_MUSIC_TEAM_ID=dummyteamid
            APPLE_MUSIC_KEY_ID=dummykid
            APPLE_MUSIC_PRIVATE_KEY_PATH=/path/to/dummy/private/key.pem
            DATABASE_URL=postgres://djplaylist:djplaylistpassword@db:5432/djplaylist
            YOUTUBE_API_KEY=dummyyoutubeapikey
            APP_VERSION=${{ env.IMAGE_TAG }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.tags.outputs.build_time }}

      # Catches a built-but-unbootable image (e.g. a Dockerfile CMD/WORKDIR
      # mismatch) before it reaches the registry or a deploy. No real
      # Postgres/Redis needed: the app's DB pool is lazy and every background
      # scheduler tick catches its own connection errors, so a crash here
      # means the process itself failed to start, not that a dependency was
      # unreachable. Runs on every build, PR previews included.
      - name: Smoke test webapp image boots
        shell: bash
        run: |
          set -euo pipefail
          img="$(head -n1 <<< "${{ steps.tags.outputs.tags }}")"
          echo "Booting $img ..."
          docker run -d --name smoke-webapp \
            -e DATABASE_URL="postgres://smoke:smoke@127.0.0.1:5432/smoke" \
            "$img"

          healthy=false
          for attempt in $(seq 1 30); do
            if docker exec smoke-webapp node -e \
              "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            then
              healthy=true
              break
            fi
            sleep 2
          done

          docker logs smoke-webapp
          docker rm -f smoke-webapp >/dev/null 2>&1 || true

          if [[ "$healthy" != "true" ]]; then
            echo "::error::webapp image never became healthy"
            exit 1
          fi
          echo "webapp image is healthy"

      - name: Push webapp
        if: env.SHOULD_PUSH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker push "$tag"
          done <<< "${{ steps.tags.outputs.tags }}"

  build-essentia:
    needs: [changes, test]
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      (github.event_name == 'pull_request' || needs.test.result == 'success') &&
      github.ref_type != 'tag' && (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.essentia == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      SHOULD_PUSH: ${{ needs.changes.outputs.should_push }}
      IMAGE_TAG: ${{ needs.changes.outputs.image_tag }}
      PLATFORMS: ${{ needs.changes.outputs.platforms }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"  # ghcr requires a lowercase repository name
          tags="ghcr.io/${owner}/essentia-api:${{ env.IMAGE_TAG }}"
          if [[ "${{ env.SHOULD_PUSH }}" == "true" && "${{ env.IMAGE_TAG }}" == v* ]]; then
            tags="${tags}"$'\n'"ghcr.io/${owner}/essentia-api:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        if: env.SHOULD_PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Essentia API
        uses: docker/build-push-action@v7
        with:
          context: ./essentia-api
          file: ./essentia-api/Dockerfile
          push: ${{ env.SHOULD_PUSH == 'true' }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=essentia-api
          cache-to: type=gha,mode=max,scope=essentia-api

  build-ga-service:
    needs: [changes, test]
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      (github.event_name == 'pull_request' || needs.test.result == 'success') &&
      github.ref_type != 'tag' && (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.ga_service == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      SHOULD_PUSH: ${{ needs.changes.outputs.should_push }}
      IMAGE_TAG: ${{ needs.changes.outputs.image_tag }}
      PLATFORMS: ${{ needs.changes.outputs.platforms }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"  # ghcr requires a lowercase repository name
          tags="ghcr.io/${owner}/ga-service:${{ env.IMAGE_TAG }}"
          if [[ "${{ env.SHOULD_PUSH }}" == "true" && "${{ env.IMAGE_TAG }}" == v* ]]; then
            tags="${tags}"$'\n'"ghcr.io/${owner}/ga-service:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        if: env.SHOULD_PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push GA service
        uses: docker/build-push-action@v7
        with:
          context: ./ga-service
          file: ./ga-service/Dockerfile
          push: ${{ env.SHOULD_PUSH == 'true' }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ga-service
          cache-to: type=gha,mode=max,scope=ga-service

  build-download-worker:
    needs: [changes, test]
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      (github.event_name == 'pull_request' || needs.test.result == 'success') &&
      github.ref_type != 'tag' && (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.download_worker == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      SHOULD_PUSH: ${{ needs.changes.outputs.should_push }}
      IMAGE_TAG: ${{ needs.changes.outputs.image_tag }}
      PLATFORMS: ${{ needs.changes.outputs.platforms }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"  # ghcr requires a lowercase repository name
          tags="ghcr.io/${owner}/download-worker:${{ env.IMAGE_TAG }}"
          if [[ "${{ env.SHOULD_PUSH }}" == "true" && "${{ env.IMAGE_TAG }}" == v* ]]; then
            tags="${tags}"$'\n'"ghcr.io/${owner}/download-worker:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        if: env.SHOULD_PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build download worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./download-worker/Dockerfile
          # Loaded locally (not pushed yet) so the smoke test below can run it
          # before anything reaches the registry; push is a separate step.
          push: false
          load: true
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=download-worker
          cache-to: type=gha,mode=max,scope=download-worker

      # gamdl crashes at import when its pywidevine/protobuf dependency does not
      # support the image's Python (a 3.14 base-image bump did exactly that and
      # failed every Apple Music download). Runs on every build, so Dependabot
      # PRs are covered.
      - name: Smoke test gamdl runs in the image
        shell: bash
        run: |
          set -euo pipefail
          img="$(head -n1 <<< "${{ steps.tags.outputs.tags }}")"
          docker run --rm --entrypoint gamdl "$img" --help >/dev/null

      - name: Push download worker
        if: env.SHOULD_PUSH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker push "$tag"
          done <<< "${{ steps.tags.outputs.tags }}"

  build-fingerprint-service:
    needs: [changes, test]
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      (github.event_name == 'pull_request' || needs.test.result == 'success') &&
      github.ref_type != 'tag' && (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.fingerprint_service == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      SHOULD_PUSH: ${{ needs.changes.outputs.should_push }}
      IMAGE_TAG: ${{ needs.changes.outputs.image_tag }}
      PLATFORMS: ${{ needs.changes.outputs.platforms }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"  # ghcr requires a lowercase repository name
          tags="ghcr.io/${owner}/fingerprint-service:${{ env.IMAGE_TAG }}"
          if [[ "${{ env.SHOULD_PUSH }}" == "true" && "${{ env.IMAGE_TAG }}" == v* ]]; then
            tags="${tags}"$'\n'"ghcr.io/${owner}/fingerprint-service:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        if: env.SHOULD_PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push fingerprint service
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./fingerprint-service/Dockerfile
          push: ${{ env.SHOULD_PUSH == 'true' }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=fingerprint-service
          cache-to: type=gha,mode=max,scope=fingerprint-service

  # The DB migration image (Dockerfile `migrator` target). Tracks the webapp
  # since it lives in the same source dir, and is promoted alongside it so
  # webapp-migrate:vX.Y.Z exists for the deploy's migrate step.
  build-migrate:
    needs: [changes, test]
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      (github.event_name == 'pull_request' || needs.test.result == 'success') &&
      github.ref_type != 'tag' && (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.webapp == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      SHOULD_PUSH: ${{ needs.changes.outputs.should_push }}
      IMAGE_TAG: ${{ needs.changes.outputs.image_tag }}
      PLATFORMS: ${{ needs.changes.outputs.platforms }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"  # ghcr requires a lowercase repository name
          tags="ghcr.io/${owner}/webapp-migrate:${{ env.IMAGE_TAG }}"
          if [[ "${{ env.SHOULD_PUSH }}" == "true" && "${{ env.IMAGE_TAG }}" == v* ]]; then
            tags="${tags}"$'\n'"ghcr.io/${owner}/webapp-migrate:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        if: env.SHOULD_PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./my-collection-search/Dockerfile
          target: migrator
          push: ${{ env.SHOULD_PUSH == 'true' }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=webapp-migrate
          cache-to: type=gha,mode=max,scope=webapp-migrate

  # On a release tag (vX.Y.Z), promote the already-built, already-tested
  # candidate images (sha-<short> from the commit's main-branch push) to the
  # version tag + latest. This re-tags multi-arch images by digest — no rebuild,
  # so the released bits are byte-identical to what CI tested.
  promote:
    needs: changes
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION_TAG: ${{ needs.changes.outputs.image_tag }}
      SHA_TAG: ${{ needs.changes.outputs.release_sha }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Promote candidate images to ${{ needs.changes.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"
          services=(webapp webapp-migrate essentia-api ga-service download-worker fingerprint-service)
          for svc in "${services[@]}"; do
            src="ghcr.io/${owner}/${svc}:${SHA_TAG}"
            # The tag event can race the main-branch build of this commit, so
            # wait for the candidate image to appear (up to ~30 min).
            found=false
            for attempt in $(seq 1 60); do
              if docker buildx imagetools inspect "$src" >/dev/null 2>&1; then
                found=true
                break
              fi
              echo "waiting for ${src} (attempt ${attempt}/60)..."
              sleep 30
            done
            if [[ "$found" != "true" ]]; then
              echo "ERROR: candidate image ${src} never appeared" >&2
              exit 1
            fi
            docker buildx imagetools create \
              -t "ghcr.io/${owner}/${svc}:${VERSION_TAG}" \
              -t "ghcr.io/${owner}/${svc}:latest" \
              "$src"
            echo "promoted ${svc}: ${SHA_TAG} -> ${VERSION_TAG} + latest"
          done
