name: Build and Publish Docker Images

on:
  pull_request:
  push:
    branches:
      - main
    # Semver releases only (vX.Y.Z). Timestamp tags (v2026...Z, no dots) from the
    # release-localbuild escape hatch intentionally don't trigger a promote.
    tags:
      - "v*.*.*"

jobs:
  # Test gate: images are only built/published if lint + tests pass.
  # Skipped on release tags — those promote already-tested images (see promote).
  test:
    if: github.ref_type != 'tag'
    uses: ./.github/workflows/test.yml

  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      webapp: ${{ steps.filter.outputs.webapp }}
      essentia: ${{ steps.filter.outputs.essentia }}
      ga_service: ${{ steps.filter.outputs.ga_service }}
      download_worker: ${{ steps.filter.outputs.download_worker }}
      fingerprint_service: ${{ steps.filter.outputs.fingerprint_service }}
      force_all: ${{ steps.filter.outputs.force_all }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      should_push: ${{ steps.meta.outputs.should_push }}
      platforms: ${{ steps.meta.outputs.platforms }}
      release_sha: ${{ steps.meta.outputs.release_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed build inputs
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
            head_ref="${{ github.event.pull_request.head.sha }}"
            changed_files="$(git diff --name-only "$base_ref" "$head_ref")"
          else
            changed_files="$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}")"
          fi

          echo "Changed files:"
          echo "$changed_files"

          webapp=false
          essentia=false
          ga_service=false
          download_worker=false
          fingerprint_service=false
          force_all=false

          while IFS= read -r file; do
            [[ -n "$file" ]] || continue

            case "$file" in
              .github/workflows/docker-publish.yml|justfile)
                force_all=true
                ;;
            esac

            case "$file" in
              my-collection-search/*)
                webapp=true
                ;;
            esac

            case "$file" in
              essentia-api/*)
                essentia=true
                ;;
            esac

            case "$file" in
              ga-service/*)
                ga_service=true
                ;;
            esac

            case "$file" in
              download-worker/*|packages/groovenet-python/*)
                download_worker=true
                ;;
            esac

            case "$file" in
              fingerprint-service/*)
                fingerprint_service=true
                ;;
            esac
          done <<< "$changed_files"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            force_all=true
          fi

          echo "webapp=$webapp" >> "$GITHUB_OUTPUT"
          echo "essentia=$essentia" >> "$GITHUB_OUTPUT"
          echo "ga_service=$ga_service" >> "$GITHUB_OUTPUT"
          echo "download_worker=$download_worker" >> "$GITHUB_OUTPUT"
          echo "fingerprint_service=$fingerprint_service" >> "$GITHUB_OUTPUT"
          echo "force_all=$force_all" >> "$GITHUB_OUTPUT"

      - name: Resolve image tag / push policy
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          # Decide the immutable image tag and whether to push:
          #   - PR              -> pr-<number>, build only (no push)
          #   - tag push (v*)   -> <tag> (e.g. v1.2.0), published release
          #   - main branch push-> sha-<short>, tested candidate image
          # Homelab is amd64-only, so we build a single arch (no slow QEMU arm64).
          platforms="linux/amd64"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            image_tag="pr-${{ github.event.pull_request.number }}"
            should_push=false
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            image_tag="${{ github.ref_name }}"
            should_push=true
          else
            image_tag="sha-${GITHUB_SHA:0:7}"
            should_push=true
          fi
          # The candidate-image tag for this commit (built on the main push),
          # which a release tag promotes instead of rebuilding.
          release_sha="sha-${GITHUB_SHA:0:7}"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "should_push=$should_push" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  build-webapp:
    needs: [changes, test]
    if: github.ref_type != 'tag' && (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.webapp == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      SHOULD_PUSH: ${{ needs.changes.outputs.should_push }}
      IMAGE_TAG: ${{ needs.changes.outputs.image_tag }}
      PLATFORMS: ${{ needs.changes.outputs.platforms }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"  # ghcr requires a lowercase repository name
          tags="ghcr.io/${owner}/webapp:${{ env.IMAGE_TAG }}"
          if [[ "${{ env.SHOULD_PUSH }}" == "true" && "${{ env.IMAGE_TAG }}" == v* ]]; then
            tags="${tags}"$'\n'"ghcr.io/${owner}/webapp:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        if: env.SHOULD_PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push webapp
        uses: docker/build-push-action@v7
        with:
          context: ./my-collection-search
          file: ./my-collection-search/Dockerfile
          # Without this, buildx builds the last stage in the Dockerfile
          # (migrator), producing an image that exits 0 and restart-loops.
          target: runner
          push: ${{ env.SHOULD_PUSH == 'true' }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=webapp
          cache-to: type=gha,mode=max,scope=webapp
          build-args: |
            OPENAI_API_KEY=dummy
            DISCOGS_USER_TOKEN=dummytoken
            DISCOGS_USERNAME=dummyusername
            DISCOGS_FOLDER_ID=dummyfolderid
            APPLE_MUSIC_TEAM_ID=dummyteamid
            APPLE_MUSIC_KEY_ID=dummykid
            APPLE_MUSIC_PRIVATE_KEY_PATH=/path/to/dummy/private/key.pem
            DATABASE_URL=postgres://djplaylist:djplaylistpassword@db:5432/djplaylist
            YOUTUBE_API_KEY=dummyyoutubeapikey
            APP_VERSION=${{ env.IMAGE_TAG }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.tags.outputs.build_time }}

  build-essentia:
    needs: [changes, test]
    if: github.ref_type != 'tag' && (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.essentia == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      SHOULD_PUSH: ${{ needs.changes.outputs.should_push }}
      IMAGE_TAG: ${{ needs.changes.outputs.image_tag }}
      PLATFORMS: ${{ needs.changes.outputs.platforms }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"  # ghcr requires a lowercase repository name
          tags="ghcr.io/${owner}/essentia-api:${{ env.IMAGE_TAG }}"
          if [[ "${{ env.SHOULD_PUSH }}" == "true" && "${{ env.IMAGE_TAG }}" == v* ]]; then
            tags="${tags}"$'\n'"ghcr.io/${owner}/essentia-api:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        if: env.SHOULD_PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Essentia API
        uses: docker/build-push-action@v7
        with:
          context: ./essentia-api
          file: ./essentia-api/Dockerfile
          push: ${{ env.SHOULD_PUSH == 'true' }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=essentia-api
          cache-to: type=gha,mode=max,scope=essentia-api

  build-ga-service:
    needs: [changes, test]
    if: github.ref_type != 'tag' && (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.ga_service == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      SHOULD_PUSH: ${{ needs.changes.outputs.should_push }}
      IMAGE_TAG: ${{ needs.changes.outputs.image_tag }}
      PLATFORMS: ${{ needs.changes.outputs.platforms }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"  # ghcr requires a lowercase repository name
          tags="ghcr.io/${owner}/ga-service:${{ env.IMAGE_TAG }}"
          if [[ "${{ env.SHOULD_PUSH }}" == "true" && "${{ env.IMAGE_TAG }}" == v* ]]; then
            tags="${tags}"$'\n'"ghcr.io/${owner}/ga-service:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        if: env.SHOULD_PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push GA service
        uses: docker/build-push-action@v7
        with:
          context: ./ga-service
          file: ./ga-service/Dockerfile
          push: ${{ env.SHOULD_PUSH == 'true' }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ga-service
          cache-to: type=gha,mode=max,scope=ga-service

  build-download-worker:
    needs: [changes, test]
    if: github.ref_type != 'tag' && (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.download_worker == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      SHOULD_PUSH: ${{ needs.changes.outputs.should_push }}
      IMAGE_TAG: ${{ needs.changes.outputs.image_tag }}
      PLATFORMS: ${{ needs.changes.outputs.platforms }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"  # ghcr requires a lowercase repository name
          tags="ghcr.io/${owner}/download-worker:${{ env.IMAGE_TAG }}"
          if [[ "${{ env.SHOULD_PUSH }}" == "true" && "${{ env.IMAGE_TAG }}" == v* ]]; then
            tags="${tags}"$'\n'"ghcr.io/${owner}/download-worker:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        if: env.SHOULD_PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push download worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./download-worker/Dockerfile
          push: ${{ env.SHOULD_PUSH == 'true' }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=download-worker
          cache-to: type=gha,mode=max,scope=download-worker

  build-fingerprint-service:
    needs: [changes, test]
    if: github.ref_type != 'tag' && (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.fingerprint_service == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      SHOULD_PUSH: ${{ needs.changes.outputs.should_push }}
      IMAGE_TAG: ${{ needs.changes.outputs.image_tag }}
      PLATFORMS: ${{ needs.changes.outputs.platforms }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"  # ghcr requires a lowercase repository name
          tags="ghcr.io/${owner}/fingerprint-service:${{ env.IMAGE_TAG }}"
          if [[ "${{ env.SHOULD_PUSH }}" == "true" && "${{ env.IMAGE_TAG }}" == v* ]]; then
            tags="${tags}"$'\n'"ghcr.io/${owner}/fingerprint-service:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        if: env.SHOULD_PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push fingerprint service
        uses: docker/build-push-action@v7
        with:
          context: ./fingerprint-service
          file: ./fingerprint-service/Dockerfile
          push: ${{ env.SHOULD_PUSH == 'true' }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=fingerprint-service
          cache-to: type=gha,mode=max,scope=fingerprint-service

  # The DB migration image (Dockerfile `migrator` target). Tracks the webapp
  # since it lives in the same source dir, and is promoted alongside it so
  # webapp-migrate:vX.Y.Z exists for the deploy's migrate step.
  build-migrate:
    needs: [changes, test]
    if: github.ref_type != 'tag' && (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.webapp == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      SHOULD_PUSH: ${{ needs.changes.outputs.should_push }}
      IMAGE_TAG: ${{ needs.changes.outputs.image_tag }}
      PLATFORMS: ${{ needs.changes.outputs.platforms }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"  # ghcr requires a lowercase repository name
          tags="ghcr.io/${owner}/webapp-migrate:${{ env.IMAGE_TAG }}"
          if [[ "${{ env.SHOULD_PUSH }}" == "true" && "${{ env.IMAGE_TAG }}" == v* ]]; then
            tags="${tags}"$'\n'"ghcr.io/${owner}/webapp-migrate:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        if: env.SHOULD_PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push migrate image
        uses: docker/build-push-action@v7
        with:
          context: ./my-collection-search
          file: ./my-collection-search/Dockerfile
          target: migrator
          push: ${{ env.SHOULD_PUSH == 'true' }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=webapp-migrate
          cache-to: type=gha,mode=max,scope=webapp-migrate

  # On a release tag (vX.Y.Z), promote the already-built, already-tested
  # candidate images (sha-<short> from the commit's main-branch push) to the
  # version tag + latest. This re-tags multi-arch images by digest — no rebuild,
  # so the released bits are byte-identical to what CI tested.
  promote:
    needs: changes
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION_TAG: ${{ needs.changes.outputs.image_tag }}
      SHA_TAG: ${{ needs.changes.outputs.release_sha }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Promote candidate images to ${{ needs.changes.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"
          services=(webapp webapp-migrate essentia-api ga-service download-worker fingerprint-service)
          for svc in "${services[@]}"; do
            src="ghcr.io/${owner}/${svc}:${SHA_TAG}"
            # The tag event can race the main-branch build of this commit, so
            # wait for the candidate image to appear (up to ~30 min).
            found=false
            for attempt in $(seq 1 60); do
              if docker buildx imagetools inspect "$src" >/dev/null 2>&1; then
                found=true
                break
              fi
              echo "waiting for ${src} (attempt ${attempt}/60)..."
              sleep 30
            done
            if [[ "$found" != "true" ]]; then
              echo "ERROR: candidate image ${src} never appeared" >&2
              exit 1
            fi
            docker buildx imagetools create \
              -t "ghcr.io/${owner}/${svc}:${VERSION_TAG}" \
              -t "ghcr.io/${owner}/${svc}:latest" \
              "$src"
            echo "promoted ${svc}: ${SHA_TAG} -> ${VERSION_TAG} + latest"
          done
