name: Test

on:
  # main is covered by the gate call from docker-publish.yml, so don't
  # self-run here on main (avoids duplicate test runs).
  push:
    branches-ignore:
      - main
  pull_request:
  # Allows docker-publish.yml to call this as a gate before building images.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: my-collection-search

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: my-collection-search/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Node 26's experimental server-side Web Storage shadows jsdom's
    # localStorage, which browser-component tests rely on.
    env:
      NODE_OPTIONS: --no-experimental-webstorage
    defaults:
      run:
        working-directory: my-collection-search

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: my-collection-search/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: my-collection-search-coverage
          path: |
            my-collection-search/coverage
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: my-collection-search/coverage/lcov.info
          flags: webapp
          disable_search: true
          fail_ci_if_error: false

      - name: Coverage summary
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  client-coverage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run client tests with coverage
        run: npm --workspace @groovenet/client run test:coverage

      - name: Upload client coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: packages/groovenet-client/coverage/lcov.info
          flags: groovenet-client
          disable_search: true
          fail_ci_if_error: false

  download-worker-coverage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: download-worker

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run worker tests with coverage
        run: uv run --group dev pytest --cov=. --cov-report=xml:coverage.xml

      - name: Upload worker coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: download-worker/coverage.xml
          flags: download-worker
          disable_search: true
          fail_ci_if_error: false

  ga-service-coverage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ga-service

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run GA service tests with coverage
        run: uv run --group dev pytest --cov=. --cov-report=xml:coverage.xml

      - name: Upload GA service coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ga-service/coverage.xml
          flags: ga-service
          disable_search: true
          fail_ci_if_error: false

  migrate-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: my-collection-search
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: djplaylist
          POSTGRES_PASSWORD: test
          POSTGRES_DB: djplaylist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U djplaylist -d djplaylist"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: my-collection-search/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migration test (up + down + up)
        run: bash ./scripts/migrate-test.sh
        env:
          DATABASE_URL: postgres://djplaylist:test@localhost:5432/djplaylist

  redis-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: my-collection-search
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: my-collection-search/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Redis integration tests
        run: npm run test:redis
        env:
          REDIS_URL: redis://localhost:6379
