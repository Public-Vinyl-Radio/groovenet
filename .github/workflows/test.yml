name: Test

on:
  pull_request:
  # Allows docker-publish.yml to call this as a gate before building images.
  workflow_call:

# Replaced PR commits should not occupy runners needed by the current commit.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    secrets: inherit

  ci-image:
    needs: changes
    if: needs.changes.outputs.ci_image == 'true'
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-npm
        with:
          cache-dependency-path: |
            package-lock.json
            my-collection-search/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build --workspace=@groovenet/contracts

      - name: Install web dependencies
        run: npm ci --prefix my-collection-search

      - name: Lint web app
        working-directory: my-collection-search
        run: npm run lint

      - name: Lint Node packages
        run: |
          npm run lint --workspace=@groovenet/contracts
          npm run lint --workspace=@groovenet/client
          npm run lint --workspace=@groovenet/player
          npm run lint --workspace=@groovenet/cli
          npm run lint --workspace=mcp-server

  test:
    needs: [changes, ci-image]
    if: needs.changes.outputs.web == 'true'
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    # Node 26's experimental server-side Web Storage shadows jsdom's
    # localStorage, which browser-component tests rely on.
    env:
      NODE_OPTIONS: --no-experimental-webstorage
    defaults:
      run:
        working-directory: my-collection-search

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-npm
        with:
          # Use the Node already verified in the CI image; retain npm caching.
          node-version: ""
          cache-dependency-path: |
            package-lock.json
            my-collection-search/package-lock.json

      - name: Install workspace dependencies
        run: npm ci --prefix ..

      - name: Build shared contracts
        run: npm run build --workspace=@groovenet/contracts --prefix ..

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Ingest tests skip without ffprobe. Assert the image still supplies it.
      - name: Verify ffprobe is available
        run: ffprobe -version

      # Coverage executes the full suite; a second plain test run duplicates it.
      - name: Run coverage
        run: npm run test:coverage

      # Run after Vitest, which clears coverage/ before generating its reports.
      - name: Test Storybook bundle validation with coverage
        run: |
          docker compose version
          npm run test:storybook
          # Node reports paths relative to this job's app working directory.
          sed -i 's#^SF:scripts/#SF:my-collection-search/scripts/#' coverage/storybook.lcov

      - name: Test optional production player deployment with coverage
        run: |
          node --test --experimental-test-coverage \
            --test-coverage-include=scripts/render-player-env.mjs \
            --test-coverage-include=scripts/render-player-web-env.mjs \
            --test-reporter=spec --test-reporter=lcov \
            --test-reporter-destination=stdout \
            --test-reporter-destination=coverage/player-deploy.lcov \
            scripts/deploy-prod.test.mjs scripts/render-player-env.test.mjs scripts/render-player-web-env.test.mjs
          sed -i 's#^SF:scripts/#SF:my-collection-search/scripts/#' coverage/player-deploy.lcov

      - name: Test dev dependency installation with coverage
        run: |
          node --test --experimental-test-coverage \
            --test-coverage-include=scripts/ensure-dev-deps.mjs \
            --test-reporter=spec --test-reporter=lcov \
            --test-reporter-destination=stdout \
            --test-reporter-destination=coverage/dev-deps.lcov \
            scripts/ensure-dev-deps.test.mjs
          sed -i 's#^SF:scripts/#SF:my-collection-search/scripts/#' coverage/dev-deps.lcov

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: my-collection-search-coverage
          path: |
            my-collection-search/coverage
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: my-collection-search/coverage/lcov.info,my-collection-search/coverage/storybook.lcov,my-collection-search/coverage/dev-deps.lcov,my-collection-search/coverage/player-deploy.lcov
          flags: webapp
          disable_search: true
          fail_ci_if_error: false

      - name: Coverage summary
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  client-coverage:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm --workspace @groovenet/contracts run build

      - name: Run client tests with coverage
        run: npm --workspace @groovenet/client run test:coverage

      - name: Test npm toolchain drift checks with coverage
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include=scripts/check-npm-toolchain.mjs
          --test-reporter=spec --test-reporter=lcov
          --test-reporter-destination=stdout
          --test-reporter-destination=packages/groovenet-client/coverage/npm-toolchain.lcov
          scripts/npm-toolchain.test.mjs

      - name: Upload client coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: packages/groovenet-client/coverage/lcov.info
          flags: groovenet-client
          disable_search: true
          fail_ci_if_error: false

      - name: Upload npm toolchain coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: packages/groovenet-client/coverage/npm-toolchain.lcov
          flags: npm-toolchain
          disable_search: true
          fail_ci_if_error: false

  player-coverage:
    needs: changes
    if: needs.changes.outputs.player == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts and client
        run: |
          npm --workspace @groovenet/contracts run build
          npm --workspace @groovenet/client run build

      - name: Run player tests with coverage
        run: npm --workspace @groovenet/player run test:coverage

      - name: Upload player coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: packages/groovenet-player/coverage/lcov.info
          flags: groovenet-player
          disable_search: true
          fail_ci_if_error: false

  contracts-coverage:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-npm

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests with coverage
        run: npm --workspace @groovenet/contracts run test:coverage

      - name: Upload contracts coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: packages/groovenet-contracts/coverage/lcov.info
          flags: groovenet-contracts
          disable_search: true
          fail_ci_if_error: false

  cli-coverage:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-npm

      - name: Install dependencies
        run: npm ci

      # The CLI resolves its client from the build output; both depend on contracts.
      - name: Build the packages
        run: |
          npm --workspace @groovenet/contracts run build
          npm --workspace @groovenet/client run build
          npm --workspace @groovenet/player run build

      - name: Run CLI tests with coverage
        run: npm --workspace @groovenet/cli run test:coverage

      - name: Run MCP server tests
        run: npm --workspace mcp-server test

      - name: Test embedding evaluation harnesses (#379, #382, #409, #424)
        run: node --test evaluations/379/*.test.mjs evaluations/382/*.test.mjs evaluations/409/*.test.mjs evaluations/424/*.test.mjs

      - name: Upload CLI coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: packages/groovenet-cli/coverage/lcov.info
          flags: groovenet-cli
          disable_search: true
          fail_ci_if_error: false

  python-client-coverage:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-npm
        with:
          cache-dependency-path: my-collection-search/package-lock.json

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install app dependencies and generate the API contract
        run: |
          npm ci
          npm --workspace @groovenet/contracts run build
          npm ci --prefix my-collection-search
          npm run openapi:generate-spec --prefix my-collection-search

      - name: Run Python client tests and contract checks with coverage
        working-directory: packages/groovenet-python
        env:
          GROOVENET_REQUIRE_OPENAPI: "1"
        run: uv run --locked --group dev pytest --cov=groovenet_client --cov-branch --cov-report=xml:coverage.xml

      - name: Build Python client distributions
        working-directory: packages/groovenet-python
        run: uv build

      - name: Upload Python client coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: packages/groovenet-python/coverage.xml
          flags: groovenet-python
          disable_search: true
          fail_ci_if_error: false

  download-worker-coverage:
    needs: changes
    if: needs.changes.outputs.download == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: download-worker

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run worker tests with coverage
        run: uv run --group dev pytest --cov=. --cov-report=xml:coverage.xml

      - name: Upload worker coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: download-worker/coverage.xml
          flags: download-worker
          disable_search: true
          fail_ci_if_error: false

  ga-service-coverage:
    needs: changes
    if: needs.changes.outputs.ga == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ga-service

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run GA service tests with coverage
        run: uv run --group dev pytest --cov=. --cov-report=xml:coverage.xml

      - name: Upload GA service coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ga-service/coverage.xml
          flags: ga-service
          disable_search: true
          fail_ci_if_error: false

  fingerprint-service-coverage:
    needs: [changes, ci-image]
    if: needs.changes.outputs.fingerprint == 'true'
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: fingerprint-service

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      # Both are mandatory: preserve the assertion when consuming the image.
      - name: Verify ffmpeg and libchromaprint are available
        run: |
          ffmpeg -version
          uv run python -c "import chromaprint; print('libchromaprint', chromaprint._libchromaprint.chromaprint_get_version())"

      - name: Run fingerprint service tests with coverage
        run: uv run --group dev pytest --cov=fingerprint_service --cov-report=xml:coverage.xml --durations=15

      - name: Upload fingerprint service coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: fingerprint-service/coverage.xml
          flags: fingerprint-service
          disable_search: true
          fail_ci_if_error: false

  migrate-test:
    needs: changes
    if: needs.changes.outputs.migrate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: my-collection-search
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: djplaylist
          POSTGRES_PASSWORD: test
          POSTGRES_DB: djplaylist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U djplaylist -d djplaylist"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-npm
        with:
          cache-dependency-path: my-collection-search/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migration test (up + down + up)
        run: bash ./scripts/migrate-test.sh
        env:
          DATABASE_URL: postgres://djplaylist:test@localhost:5432/djplaylist

      # Reuses the schema the step above just re-applied.
      - name: Run fingerprint schema integration tests
        run: npm run test:fingerprints
        env:
          DATABASE_URL: postgres://djplaylist:test@localhost:5432/djplaylist

      - name: Verify persistent server-player SQL and worker exclusion
        run: |
          npm ci --prefix ..
          npm run build --workspace @groovenet/contracts --prefix ..
          npm run build --workspace @groovenet/client --prefix ..
          npm test --workspace @groovenet/player --prefix .. -- --run src/server/store.integration.test.ts
        env:
          DATABASE_URL: postgres://djplaylist:test@localhost:5432/djplaylist
          RUN_PLAYER_DB_TESTS: "1"

  redis-test:
    needs: changes
    if: needs.changes.outputs.redis == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: my-collection-search
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-npm
        with:
          cache-dependency-path: my-collection-search/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Redis integration tests
        run: npm run test:redis
        env:
          REDIS_URL: redis://localhost:6379
