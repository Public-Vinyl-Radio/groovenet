name: clean-install

# Clean-install smoke tests on the published release-candidate images, through
# migrations and the first Discogs import:
#   clean-install  the README quick start (#1239)
#   install-script the one-line installer (#1072), then a rerun that must be a no-op
# They need the images the main-branch push builds and are slow, so PRs run only
# the installer job, and only when the installer or its inputs change (against
# the images of main's tip). Run either by hand against any tag with
# workflow_dispatch.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/clean-install.yml
      - .github/scripts/wait-for-images.sh
      - site/public/install.sh
      - scripts/install/**
      - scripts/lib/clean-install-checks.sh
      - scripts/clean-install-test.sh
      - docker-compose.yml
      - docker-compose.images.yml
      - docker-compose.local.yml
      - .env.example
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag: vX.Y.Z or sha-<short>. Empty: the latest release."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: clean-install-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clean-install:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest # amd64, which is all the images are built for
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release tags, for the "latest release" default

      - name: Resolve the image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "tag=sha-${GITHUB_SHA:0:7}" >>"$GITHUB_OUTPUT"
          else
            echo "tag=${INPUT_TAG}" >>"$GITHUB_OUTPUT"
          fi

      - name: Wait for the candidate images
        if: github.event_name == 'push'
        run: .github/scripts/wait-for-images.sh "${{ steps.tag.outputs.tag }}"

      - name: Note a missing Discogs token
        env:
          DISCOGS_TOKEN: ${{ secrets.CLEAN_INSTALL_DISCOGS_TOKEN }}
        run: |
          if [[ -z "$DISCOGS_TOKEN" ]]; then
            echo "::warning::Secret CLEAN_INSTALL_DISCOGS_TOKEN is not set, so the Discogs import step is skipped. Add it to cover the first import."
          fi

      - name: Clean-install test
        env:
          DISCOGS_USER_TOKEN: ${{ secrets.CLEAN_INSTALL_DISCOGS_TOKEN }}
          CLEAN_INSTALL_LOG_DIR: ${{ runner.temp }}/clean-install-logs
          TAG: ${{ steps.tag.outputs.tag }}
          REGISTRY: ghcr.io/public-vinyl-radio
        run: ./scripts/clean-install-test.sh "$TAG"

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: clean-install-logs
          path: ${{ runner.temp }}/clean-install-logs
          if-no-files-found: ignore

  install-script:
    runs-on: ubuntu-latest # amd64; also has Docker, sudo and /srv, like a fresh VPS
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # origin/main and release tags

      - name: ShellCheck
        run: |
          shellcheck site/public/install.sh scripts/install/*.sh scripts/lib/*.sh scripts/clean-install-test.sh .github/scripts/wait-for-images.sh

      - name: Installer unit tests (bash and dash)
        run: |
          scripts/install/unit_test.sh
          TEST_SH=dash scripts/install/unit_test.sh

      - name: Resolve the image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            push) echo "tag=sha-${GITHUB_SHA:0:7}" >>"$GITHUB_OUTPUT" ;;
            pull_request) echo "tag=sha-$(git rev-parse --short=7 origin/main)" >>"$GITHUB_OUTPUT" ;;
            *) echo "tag=${INPUT_TAG}" >>"$GITHUB_OUTPUT" ;;
          esac

      # On a PR the end-to-end run pairs main's published images with the PR's
      # compose files. That is wrong when the PR changes an image and its compose
      # together (e.g. the user a container runs as), and the images are only
      # built from main. So skip it when the PR touches an image's build inputs;
      # the push to main still runs it against the images built from that code.
      - name: Does this PR change image build inputs?
        id: images
        run: |
          skip=false
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if git diff --name-only origin/main...HEAD | grep -Eq '(^|/)(Dockerfile[^/]*|entrypoint\.sh|link-volumes\.sh)$'; then
              skip=true
              echo "::notice::This PR changes image build inputs, so the end-to-end install is skipped here; it runs on the push to main against the images built from this code."
            fi
          fi
          echo "skip=$skip" >>"$GITHUB_OUTPUT"

      - name: Wait for the candidate images
        if: github.event_name != 'workflow_dispatch' && steps.images.outputs.skip != 'true'
        run: .github/scripts/wait-for-images.sh "${{ steps.tag.outputs.tag }}"

      - name: Note a missing Discogs token
        if: steps.images.outputs.skip != 'true'
        env:
          DISCOGS_TOKEN: ${{ secrets.CLEAN_INSTALL_DISCOGS_TOKEN }}
        run: |
          if [[ -z "$DISCOGS_TOKEN" ]]; then
            echo "::warning::Secret CLEAN_INSTALL_DISCOGS_TOKEN is not set (it is not on fork PRs), so the Discogs import is skipped."
          fi

      # Installs with the installer's own defaults (project groovenet, port 3000,
      # /srv/groovenet), checks the stack, reruns the installer and checks it
      # changed nothing, then removes everything.
      - name: Installer end to end
        if: steps.images.outputs.skip != 'true'
        env:
          DISCOGS_USER_TOKEN: ${{ secrets.CLEAN_INSTALL_DISCOGS_TOKEN }}
          CLEAN_INSTALL_LOG_DIR: ${{ runner.temp }}/install-script-logs
          INSTALL_TEST_DEFAULTS: "1"
          TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/install/e2e.sh "$TAG"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: install-script-logs
          path: ${{ runner.temp }}/install-script-logs
          if-no-files-found: ignore
