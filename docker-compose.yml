# Container hardening (#1074). Every service merges this block, and
# scripts/compose-hardening/check.py (a CI job) fails any service that does not.
#   no-new-privileges  a process can never gain privileges through setuid
#                      binaries or file capabilities.
#   read_only          the root filesystem is read-only; whatever a service
#                      writes outside its volumes gets a tmpfs (or, for large
#                      scratch space, a volume), listed next to the service.
#   cap_drop: ALL      services start with no Linux capabilities. A service
#                      adds back only what it was shown to need, with the reason
#                      next to its `cap_add`.
# Memory limits use `mem_limit`, which plain `docker compose` enforces (the
# `deploy.resources` form is ignored outside Swarm on older Compose). Every
# limit reads a variable from `.env`, so a small VPS can shrink them; see the
# "Memory limits" table in docs or .env.example for measured usage.
x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  app:
    <<: *hardening
    mem_limit: ${APP_MEM_LIMIT:-1536m}
    # Writable scratch: /tmp, Next's cache (image optimiser; rebuilt on demand) and
    # restic's cache (RESTIC_CACHE_DIR below). Counts toward the memory limit.
    tmpfs:
      - /tmp:size=256m
      - /app/my-collection-search/my-collection-search/.next/cache:size=128m,uid=1001,gid=1001
    build:
      context: .
      dockerfile: my-collection-search/Dockerfile
      target: runner
    labels:
      - "deployed.revision=*${GIT_SHA:-dev}" # change on every commit -> forces recreate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-djplaylist}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-djplaylist}
      APPLE_MUSIC_TEAM_ID: ${APPLE_MUSIC_TEAM_ID}
      APPLE_MUSIC_KEY_ID: ${APPLE_MUSIC_KEY_ID}
      APPLE_MUSIC_PRIVATE_KEY: ${APPLE_MUSIC_PRIVATE_KEY}
      DISCOGS_USER_TOKEN: ${DISCOGS_USER_TOKEN}
      DISCOGS_USERNAME: ${DISCOGS_USERNAME}
      DISCOGS_FOLDER_ID: ${DISCOGS_FOLDER_ID}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_GENRE_RECONCILIATION_MODEL: ${OPENAI_GENRE_RECONCILIATION_MODEL:-gpt-5-mini}
      GENRE_RECONCILIATION_INPUT_USD_PER_MTOK: ${GENRE_RECONCILIATION_INPUT_USD_PER_MTOK:-0.25}
      GENRE_RECONCILIATION_OUTPUT_USD_PER_MTOK: ${GENRE_RECONCILIATION_OUTPUT_USD_PER_MTOK:-2}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      REDIS_URL: redis://redis:6379
      ESSENTIA_API_URL: http://essentia:8001/analyze
      ESSENTIA_DATA_DIR: /app/essentia-data
      AUDIO_INGEST_DIR: /app/audio-ingest
      SET_RECORDINGS_DIR: /app/set-recordings
      WORKTREE_HOST: ${WORKTREE_HOST:-}
      ENABLE_DEVELOPER_TOOLS: ${ENABLE_DEVELOPER_TOOLS:-false}
      STORYBOOK_URL: ${STORYBOOK_URL-/storybook/index.html}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      RESTIC_CACHE_DIR: /tmp/restic-cache
      BACKUP_HEALTH_MAX_AGE_HOURS: ${BACKUP_HEALTH_MAX_AGE_HOURS:-12}
      RECORD_CLEANING_OVERDUE_DAYS: ${RECORD_CLEANING_OVERDUE_DAYS:-365}
      GROOVENET_TIME_ZONE: ${GROOVENET_TIME_ZONE:-UTC}
      # Rate limiting (#1074): proxies appending to X-Forwarded-For, and an off switch.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-false}
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}

    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      # Migrations run on every `up`; a failed one keeps the app down.
      migrate:
        condition: service_completed_successfully
      volume-perms:
        condition: service_completed_successfully
    volumes:
      - ${APP_AUDIO_MOUNT:-music_data:/app/audio}
      - db_dumps:/app/dumps
      - discogs_exports:/app/discogs_exports
      - cookie_data:/app/cookies
      - album_covers:/app/public/uploads/album-covers
      - essentia_data:/app/essentia-data
      - audio_ingest:/app/audio-ingest
      # Set recordings the CLI uploads (#282). Read-write here; the set worker
      # mounts the same store read-only.
      - ${SET_RECORDINGS_MOUNT:-set_recordings:/app/set-recordings}

  # One-shot init service, like `migrate`: runs on every `up`, exits 0, and the
  # services that write to the shared volumes wait for it (#1074). Every Groovenet
  # image runs as uid/gid 1001, but volumes made by older (root) images hold
  # root-owned files, and a bind-mounted host directory belongs to whoever made it.
  # This is the only container that still runs as root, with just the capabilities
  # chown needs. Idempotent and fast: it only chowns what is not already 1001,
  # and walks stat-only once nothing is left to fix. Small metadata directories
  # are re-owned whatever their owner. Media directories (hundreds of GB) get
  # their top level plus anything owned by root, which is what the old root
  # worker wrote and the new one must be able to overwrite; files owned by any
  # other user, such as a host music library bind-mounted in, are left alone.
  volume-perms:
    <<: *hardening
    image: ${VOLUME_PERMS_IMAGE:-alpine:3.22}
    user: "0:0"
    mem_limit: ${VOLUME_PERMS_MEM_LIMIT:-64m}
    # CHOWN to change owners; DAC_OVERRIDE and FOWNER because the files being
    # fixed belong to other users (root, or uid 1001 on a host directory).
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -u
        fix_tree() {
          [ -d "$$1" ] || return 0
          find "$$1" -xdev \( ! -user 1001 -o ! -group 1001 \) -exec chown -h 1001:1001 {} + \
            || echo "volume-perms: could not fix everything under $$1 (continuing)"
        }
        fix_media() {
          [ -d "$$1" ] || return 0
          chown 1001:1001 "$$1" || echo "volume-perms: could not fix $$1 (continuing)"
          find "$$1" -xdev -user 0 -exec chown -h 1001:1001 {} + \
            || echo "volume-perms: could not fix root-owned files under $$1 (continuing)"
        }
        for d in /app/dumps /app/discogs_exports /app/cookies /app/essentia-data /app/public/uploads/album-covers; do fix_tree "$$d"; done
        for d in /app/audio /app/audio-ingest /app/set-recordings; do fix_media "$$d"; done
        exit 0
    volumes:
      - ${APP_AUDIO_MOUNT:-music_data:/app/audio}
      - db_dumps:/app/dumps
      - discogs_exports:/app/discogs_exports
      - cookie_data:/app/cookies
      - album_covers:/app/public/uploads/album-covers
      - essentia_data:/app/essentia-data
      - audio_ingest:/app/audio-ingest
      - ${SET_RECORDINGS_MOUNT:-set_recordings:/app/set-recordings}

  # One-shot init service: runs on every `up` and exits 0 (also when there is
  # nothing to apply). `app` waits on it. No `restart:` - it must stay exited.
  migrate:
    <<: *hardening
    mem_limit: ${MIGRATE_MEM_LIMIT:-512m}
    # npm writes its logs and update check under HOME.
    tmpfs:
      - /tmp:size=32m
      - /home/nextjs:size=32m,uid=1001,gid=1001
    build:
      context: .
      dockerfile: my-collection-search/Dockerfile
      target: migrator
    working_dir: /repo/my-collection-search
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-djplaylist}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-djplaylist}
    entrypoint:
      [
        "sh",
        "-c",
        "until pg_isready -h db -U ${POSTGRES_USER:-djplaylist}; do sleep 1; done && sh /repo/my-collection-search/scripts/migrate-preflight.sh && npm run migrate -- up",
      ]
    depends_on:
      - db

  # One-off maintenance scripts (src/scripts/*.ts), e.g. backfill-key-confidence
  # (#524). Built on demand (`just scripts-build`), never by `docker compose up`
  # (profile-gated) or by CI. It depends on `db` only, so `run --rm scripts` never
  # triggers `migrate`. No fixed command: `just scripts-run`
  # supplies it, e.g. `just scripts-run npm run backfill-key-confidence -- --limit=5`.
  scripts:
    <<: *hardening
    mem_limit: ${SCRIPTS_MEM_LIMIT:-1g}
    tmpfs:
      - /tmp:size=256m
      - /home/nextjs:size=128m,uid=1001,gid=1001
    build:
      context: .
      dockerfile: my-collection-search/Dockerfile
      target: scripts
    profiles:
      - scripts
    working_dir: /repo/my-collection-search
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-djplaylist}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-djplaylist}
      ESSENTIA_DATA_DIR: /app/essentia-data
    volumes:
      - essentia_data:/app/essentia-data
    depends_on:
      - db

  db:
    <<: *hardening
    mem_limit: ${DB_MEM_LIMIT:-1g}
    # The Unix socket and lock file; Postgres writes nothing else outside PGDATA.
    tmpfs:
      - /tmp:size=64m
      - /var/run/postgresql:uid=999,gid=999,mode=2775,size=1m
    # Not root (#1074): the official entrypoint only chowns and drops privileges
    # when it starts as root, so running as postgres needs no capabilities. The
    # data directory is already postgres's on every existing install.
    user: postgres
    image: pgvector/pgvector:pg15
    restart: always
    command: ["postgres", "-c", "maintenance_work_mem=256MB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-djplaylist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-djplaylist}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-djplaylist} -d ${POSTGRES_DB:-djplaylist}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  essentia:
    <<: *hardening
    mem_limit: ${ESSENTIA_MEM_LIMIT:-2g}
    # The service downloads each track to /tmp before analysing it, so its size
    # caps the file it can analyse (the worker sends a WAV, about 10 MB a minute).
    # Counts toward the memory limit.
    tmpfs:
      - /tmp:size=${ESSENTIA_TMP_SIZE:-1g}
    profiles: [analysis, downloads, all]
    build:
      context: essentia-api
    restart: unless-stopped
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-0.3.2}
      SENTRY_SERVICE: essentia-api

  ga-service:
    <<: *hardening
    mem_limit: ${GA_MEM_LIMIT:-512m}
    tmpfs:
      - /tmp:size=32m
    profiles: [optimize, all]
    build:
      context: ga-service
    restart: unless-stopped
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-0.3.2}
      SENTRY_SERVICE: ga-service

  redis:
    <<: *hardening
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    # Not root (#1074), for the same reason as db. /data is already redis's.
    user: redis
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  download-worker:
    <<: *hardening
    mem_limit: ${DOWNLOAD_WORKER_MEM_LIMIT:-1536m}
    # Downloads are staged in /app/downloads and tracks fetched for local analysis
    # land in /tmp: gigabytes for lossless albums, so these are volumes on disk,
    # not tmpfs. HOME holds the yt-dlp and gamdl caches.
    tmpfs:
      - /home/groovenet:size=64m,uid=1001,gid=1001,mode=0700
    profiles: [downloads, all]
    build:
      context: .
      dockerfile: download-worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://${POSTGRES_USER:-djplaylist}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-djplaylist}
      GAMDL_COOKIE_FILE: /app/cookies/gamdl_cookies.txt
      GAMDL_WRAPPER_URL: ${GAMDL_WRAPPER_URL:-}
      GAMDL_WRAPPER_DECRYPT_HOST: ${GAMDL_WRAPPER_DECRYPT_HOST:-}
      GAMDL_WRAPPER_DECRYPT_PORT: ${GAMDL_WRAPPER_DECRYPT_PORT:-}
      ESSENTIA_DATA_DIR: /app/essentia-data
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-0.3.2}
      SENTRY_SERVICE: download-worker
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_started
      volume-perms:
        condition: service_completed_successfully
    volumes:
      - worker_downloads:/app/downloads
      - worker_tmp:/tmp
      - ${WORKER_AUDIO_MOUNT:-music_data:/app/audio}
      - album_covers:/app/public/uploads/album-covers
      - cookie_data:/app/cookies # Shared cookie storage with app service
      - essentia_data:/app/essentia-data
    restart: unless-stopped

  # Queue-driven: pops fingerprint_queue, decodes the chunk, matches it, and
  # reports back over the app's REST API. No published port on purpose.
  fingerprint-service:
    <<: *hardening
    mem_limit: ${FINGERPRINT_MEM_LIMIT:-768m}
    # ffmpeg's stderr is buffered in a temporary file.
    tmpfs:
      - /tmp:size=64m
    profiles: [fingerprint, all]
    build:
      context: .
      dockerfile: fingerprint-service/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      APP_URL: http://app:3000
      AUDIO_INGEST_DIR: /app/audio-ingest
      AUDIO_DIR: /app/audio
      FINGERPRINT_SAMPLE_RATE: ${FINGERPRINT_SAMPLE_RATE:-22050}
      # `stub` matches nothing and stores null fingerprints — it exists to
      # exercise the pipeline, not to run it. This default outlived the real
      # matcher landing in #278 and quietly made a live deployment index its
      # whole library to null blobs.
      FINGERPRINT_MATCHER: ${FINGERPRINT_MATCHER:-chromaprint}
      FINGERPRINT_MAX_BER: ${FINGERPRINT_MAX_BER:-0.25}
      # Off unless set: windows quieter than this many dBFS are not matched.
      # Tune it from the Level column on /vinyl before setting it.
      FINGERPRINT_MIN_LEVEL_DBFS: ${FINGERPRINT_MIN_LEVEL_DBFS:-}
      FINGERPRINT_VERSION: ${FINGERPRINT_VERSION:-1}
      # Live windows and library indexing. Set recordings go to their own
      # worker below, so a three-hour decode never delays a live window.
      FINGERPRINT_QUEUES: fingerprint_queue,fingerprint_index_queue
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-0.3.2}
      SENTRY_SERVICE: fingerprint-service
    depends_on:
      redis:
        condition: service_started
      volume-perms:
        condition: service_completed_successfully
    volumes:
      # Mounted directly, unlike essentia-api, so chunks never have to be
      # re-served over HTTP to reach the service that needs them.
      - audio_ingest:/app/audio-ingest
      # The reference library, read-only: library indexing (#277) fingerprints
      # whole tracks from here, and nothing in this service ever writes to it.
      - ${WORKER_AUDIO_MOUNT:-music_data:/app/audio}:ro
    restart: unless-stopped

  # Same image, second process: derives tracklists from whole set recordings
  # (#282). Its own heartbeat key, or each worker would vouch for the other.
  fingerprint-set-worker:
    profiles: [fingerprint, all]
    extends: fingerprint-service
    mem_limit: ${FINGERPRINT_SET_MEM_LIMIT:-768m}
    environment:
      FINGERPRINT_QUEUES: fingerprint_set_queue
      FINGERPRINT_HEARTBEAT_KEY: fingerprint:heartbeat:set
      SENTRY_SERVICE: fingerprint-set-worker
    volumes:
      # Whole set recordings, read-only. Not the ingest volume: the app sweeps
      # anything there without an `audio_ingests` row. A host path works too.
      - ${SET_RECORDINGS_MOUNT:-set_recordings:/app/set-recordings}:ro

volumes:
  db_data:
  music_data:
  db_dumps:
  discogs_exports:
  redis_data:
  cookie_data:
  album_covers:
  essentia_data:
  audio_ingest:
  set_recordings:
  # Scratch space for download-worker (see its tmpfs comment). Disposable.
  worker_downloads:
  worker_tmp:
