services:
  app:
    build:
      context: my-collection-search
      target: runner
    labels:
      - "deployed.revision=*${GIT_SHA:-dev}"  # change on every commit -> forces recreate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-djplaylist}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-djplaylist}
      APPLE_MUSIC_TEAM_ID: ${APPLE_MUSIC_TEAM_ID}
      APPLE_MUSIC_KEY_ID: ${APPLE_MUSIC_KEY_ID}
      APPLE_MUSIC_PRIVATE_KEY: ${APPLE_MUSIC_PRIVATE_KEY}
      DISCOGS_USER_TOKEN: ${DISCOGS_USER_TOKEN}
      DISCOGS_USERNAME: ${DISCOGS_USERNAME}
      DISCOGS_FOLDER_ID: ${DISCOGS_FOLDER_ID}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      REDIS_URL: redis://redis:6379
      ESSENTIA_API_URL: http://essentia:8001/analyze
      ESSENTIA_DATA_DIR: /app/essentia-data
      AUDIO_INGEST_DIR: /app/audio-ingest
      SET_RECORDINGS_DIR: /app/set-recordings
      WORKTREE_HOST: ${WORKTREE_HOST:-}
      ENABLE_DEVELOPER_TOOLS: ${ENABLE_DEVELOPER_TOOLS:-false}
      STORYBOOK_URL: ${STORYBOOK_URL:-}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      BACKUP_HEALTH_MAX_AGE_HOURS: ${BACKUP_HEALTH_MAX_AGE_HOURS:-12}
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}

    depends_on:
      - db
      - redis
    volumes:
      - ${APP_AUDIO_MOUNT:-music_data:/app/audio}
      - db_dumps:/app/dumps
      - discogs_exports:/app/discogs_exports
      - cookie_data:/app/cookies
      - album_covers:/app/public/uploads/album-covers
      - essentia_data:/app/essentia-data
      - audio_ingest:/app/audio-ingest
      # Set recordings the CLI uploads (#282). Read-write here; the set worker
      # mounts the same store read-only.
      - ${SET_RECORDINGS_MOUNT:-set_recordings:/app/set-recordings}

  migrate:
    build:
      context: my-collection-search
      target: migrator
    profiles:
      - migrate
    working_dir: /app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-djplaylist}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-djplaylist}
    entrypoint: ["sh", "-c", "until pg_isready -h db -U ${POSTGRES_USER:-djplaylist}; do sleep 1; done && sh /app/scripts/migrate-preflight.sh && npm run migrate -- up"]
    depends_on:
      - db

  db:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-djplaylist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-djplaylist}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-djplaylist} -d ${POSTGRES_DB:-djplaylist}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  essentia:
    build:
      context: essentia-api

  ga-service:
    build:
      context: ga-service

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  download-worker:
    build:
      context: .
      dockerfile: download-worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://${POSTGRES_USER:-djplaylist}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-djplaylist}
      GAMDL_COOKIE_FILE: /app/cookies/gamdl_cookies.txt
      ESSENTIA_DATA_DIR: /app/essentia-data
    depends_on:
      - redis
      - db
    volumes:
      - ${WORKER_AUDIO_MOUNT:-music_data:/app/audio}
      - album_covers:/app/public/uploads/album-covers
      - cookie_data:/app/cookies  # Shared cookie storage with app service
      - essentia_data:/app/essentia-data
    restart: unless-stopped

  # Queue-driven: pops fingerprint_queue, decodes the chunk, matches it, and
  # reports back over the app's REST API. No published port on purpose.
  fingerprint-service:
    build:
      context: fingerprint-service
    environment:
      REDIS_URL: redis://redis:6379
      APP_URL: http://app:3000
      AUDIO_INGEST_DIR: /app/audio-ingest
      AUDIO_DIR: /app/audio
      FINGERPRINT_SAMPLE_RATE: ${FINGERPRINT_SAMPLE_RATE:-22050}
      # `stub` matches nothing and stores null fingerprints — it exists to
      # exercise the pipeline, not to run it. This default outlived the real
      # matcher landing in #278 and quietly made a live deployment index its
      # whole library to null blobs.
      FINGERPRINT_MATCHER: ${FINGERPRINT_MATCHER:-chromaprint}
      FINGERPRINT_MAX_BER: ${FINGERPRINT_MAX_BER:-0.25}
      # Off unless set: windows quieter than this many dBFS are not matched.
      # Tune it from the Level column on /vinyl before setting it.
      FINGERPRINT_MIN_LEVEL_DBFS: ${FINGERPRINT_MIN_LEVEL_DBFS:-}
      FINGERPRINT_VERSION: ${FINGERPRINT_VERSION:-1}
      # Live windows and library indexing. Set recordings go to their own
      # worker below, so a three-hour decode never delays a live window.
      FINGERPRINT_QUEUES: fingerprint_queue,fingerprint_index_queue
    depends_on:
      - redis
    volumes:
      # Mounted directly, unlike essentia-api, so chunks never have to be
      # re-served over HTTP to reach the service that needs them.
      - audio_ingest:/app/audio-ingest
      # The reference library, read-only: library indexing (#277) fingerprints
      # whole tracks from here, and nothing in this service ever writes to it.
      - ${WORKER_AUDIO_MOUNT:-music_data:/app/audio}:ro
    restart: unless-stopped

  # Same image, second process: derives tracklists from whole set recordings
  # (#282). Its own heartbeat key, or each worker would vouch for the other.
  fingerprint-set-worker:
    extends: fingerprint-service
    environment:
      FINGERPRINT_QUEUES: fingerprint_set_queue
      FINGERPRINT_HEARTBEAT_KEY: fingerprint:heartbeat:set
    volumes:
      # Whole set recordings, read-only. Not the ingest volume: the app sweeps
      # anything there without an `audio_ingests` row. A host path works too.
      - ${SET_RECORDINGS_MOUNT:-set_recordings:/app/set-recordings}:ro

volumes:
  db_data:
  music_data:
  db_dumps:
  discogs_exports:
  redis_data:
  cookie_data:
  album_covers:
  essentia_data:
  audio_ingest:
  set_recordings:
