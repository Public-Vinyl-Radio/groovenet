[project]
name = "ga-service"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "numpy>=1.24.0",
    "requests>=2.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[tool.coverage.run]
omit = ["tests/*"]
