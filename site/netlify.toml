[build]
  command = "npm run build"
  publish = "dist"
  # Skip the build when nothing the site renders has changed: site/ itself,
  # the docs tree and the changelog (paths are relative to the base directory).
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"
  # package.json pins engines.npm; Netlify's Node 22 image ships npm 10.
  NPM_VERSION = "12.0.1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
