[build]
  command = "npm run build"
  publish = "dist"
  # Skip the build when nothing the site renders has changed: site/ itself,
  # the docs tree and the changelog (paths are relative to the base directory).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../docs ../CHANGELOG.md"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
