# Development overrides.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  app:
    environment:
      NODE_ENV: development
      NPM_CONFIG_CACHE: /tmp/.npm
      # Make file watching reliable in Docker on macOS/Windows
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "700"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "700"
    volumes:
      # Mount source code for live reload
      - ./my-collection-search:/app
      # Named volume keeps node_modules isolated from the host and independent of the image
      - dev_node_modules:/app/node_modules
      - ${APP_AUDIO_MOUNT:-music_data:/app/audio}
      - ${APP_ALBUM_COVERS_SRC:-album_covers}:/app/public/uploads/album-covers
      - essentia_data:/app/essentia-data
      - db_dumps:/app/dumps
      - discogs_exports:/app/discogs_exports
      # Serve the static Storybook build same-origin at /storybook/ in dev too.
      # Run `just build-storybook` first so the dir exists, then recreate.
      - ./my-collection-search/storybook-static:/app/public/storybook:ro
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 -p 3000"

  essentia:

  ga-service:

  download-worker:
    environment:
      GAMDL_COOKIE_FILE: /app/cookies/gamdl_cookies.txt
    volumes:
      - ${WORKER_AUDIO_MOUNT:-music_data:/app/audio}
      - ${WORKER_ALBUM_COVERS_SRC:-album_covers}:/app/public/uploads/album-covers
      - essentia_data:/app/essentia-data
      - cookie_data:/app/cookies:ro

volumes:
  dev_node_modules:
