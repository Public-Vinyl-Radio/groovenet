# Development overrides.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  app:
    build:
      target: dev
    working_dir: /app
    environment:
      NODE_ENV: development
      NPM_CONFIG_CACHE: /tmp/.npm
      # Run `just storybook` separately; see README's Storybook workflow.
      STORYBOOK_URL: ${STORYBOOK_URL-http://localhost:6006}
      # Make file watching reliable in Docker on macOS/Windows
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "700"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "700"
    volumes:
      # Mount source code for live reload
      - ./my-collection-search:/app
      - ./packages/groovenet-contracts:/packages/groovenet-contracts
      # Named volume keeps node_modules isolated from the host and independent of the image
      - dev_node_modules:/app/node_modules
      - ${APP_AUDIO_MOUNT:-music_data:/app/audio}
      - ${APP_ALBUM_COVERS_SRC:-${HOME}/groovenet-covers}:/app/public/uploads/album-covers
      - essentia_data:/app/essentia-data
      - db_dumps:/app/dumps
      - discogs_exports:/app/discogs_exports
    # `just bootstrap`'s root npm ci can leave packages/groovenet-contracts with
    # its own real node_modules (hoisting conflicts with the root's typescript
    # alias force a nested install there), built for the host's platform. On
    # Apple Silicon that's darwin-arm64, not this Linux container's arm64, so
    # ln -sfn on its own is a no-op: linking onto an existing real directory
    # places the link inside it instead of replacing it, leaving contracts'
    # own (wrong-platform) typescript in charge. rm -rf first so the symlink
    # actually takes over and contracts builds against this container's
    # freshly-installed, correct-platform node_modules.
    command: sh -c "node scripts/ensure-dev-deps.mjs && rm -rf /packages/groovenet-contracts/node_modules && ln -sfn /app/node_modules /packages/groovenet-contracts/node_modules && npm --prefix /packages/groovenet-contracts run build && npm run dev -- -H 0.0.0.0 -p 3000"

  essentia:

  ga-service:

  download-worker:
    environment:
      GAMDL_COOKIE_FILE: /app/cookies/gamdl_cookies.txt
    volumes:
      - ${WORKER_AUDIO_MOUNT:-music_data:/app/audio}
      - ${WORKER_ALBUM_COVERS_SRC:-${HOME}/groovenet-covers}:/app/public/uploads/album-covers
      - essentia_data:/app/essentia-data
      - cookie_data:/app/cookies:ro

volumes:
  dev_node_modules:
