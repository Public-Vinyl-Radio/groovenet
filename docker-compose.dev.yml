# Development overrides.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  app:
    build:
      target: dev
    working_dir: /app
    environment:
      NODE_ENV: development
      NPM_CONFIG_CACHE: /tmp/.npm
      # Run `just storybook` separately; see README's Storybook workflow.
      STORYBOOK_URL: ${STORYBOOK_URL-http://localhost:6006}
      # Make file watching reliable in Docker on macOS/Windows
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "700"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "700"
    volumes:
      # Mount source code for live reload
      - ./my-collection-search:/app
      # The web app resolves @groovenet/contracts and @groovenet/client through
      # these mounts. Their build/ output comes from `just bootstrap`
      # (host-built, platform independent): the container never builds them,
      # and never writes into the host's package directories.
      - ./packages/groovenet-contracts:/packages/groovenet-contracts:ro
      - ./packages/groovenet-client:/packages/groovenet-client:ro
      # Named volume keeps node_modules isolated from the host and independent of the image
      - dev_node_modules:/app/node_modules
      # Their build output imports zod and each other, resolved by walking up
      # from /packages/<pkg>, never reaching /app/node_modules. The same volume
      # here, a container-only path, serves those imports.
      - dev_node_modules:/packages/node_modules:ro
      - ${APP_AUDIO_MOUNT:-music_data:/app/audio}
      - ${APP_ALBUM_COVERS_SRC:-${HOME}/groovenet-covers}:/app/public/uploads/album-covers
      - essentia_data:/app/essentia-data
      - db_dumps:/app/dumps
      - discogs_exports:/app/discogs_exports
    command: >-
      sh -c "for f in contracts client; do test -f /packages/groovenet-$$f/build/index.js
      || { echo \"packages/groovenet-$$f/build is missing: run just bootstrap on the host\" >&2; exit 1; }; done
      && node scripts/ensure-dev-deps.mjs && npm run dev -- -H 0.0.0.0 -p 3000"

  essentia:

  ga-service:

  download-worker:
    environment:
      GAMDL_COOKIE_FILE: /app/cookies/gamdl_cookies.txt
    volumes:
      - ${WORKER_AUDIO_MOUNT:-music_data:/app/audio}
      - ${WORKER_ALBUM_COVERS_SRC:-${HOME}/groovenet-covers}:/app/public/uploads/album-covers
      - essentia_data:/app/essentia-data
      - cookie_data:/app/cookies:ro

volumes:
  dev_node_modules:
