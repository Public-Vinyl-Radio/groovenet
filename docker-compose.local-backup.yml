# Optional local backup disk (#1311). Added only when LOCAL_BACKUP_PATH is set, so a
# host without one gets no extra mount: deploy-prod.sh appends this file when the
# variable is set in .env.host. Run it by hand with
#   docker compose -f docker-compose.yml -f docker-compose.local-backup.yml up -d
# See docs/configuration/integrations.md for preparing the disk.
services:
  app:
    environment:
      # The app treats a set LOCAL_BACKUP_DIR as "a local target exists".
      LOCAL_BACKUP_DIR: /mnt/local-backup
      LOCAL_BACKUP_RESTIC_PASSWORD: ${LOCAL_BACKUP_RESTIC_PASSWORD:-}
    volumes:
      # Host path of the mounted disk. `:?` fails the deploy loudly rather than
      # mounting an empty string if this file is used without the variable.
      - ${LOCAL_BACKUP_PATH:?set LOCAL_BACKUP_PATH to the mounted backup disk}:/mnt/local-backup
