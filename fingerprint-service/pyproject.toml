[project]
name = "fingerprint-service"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "redis==8.1.0",
    "requests==2.34.2",
    # Ships the `chromaprint` ctypes module. The native libchromaprint it binds
    # to comes from the image (see Dockerfile); on macOS, `brew install
    # chromaprint` plus DYLD_FALLBACK_LIBRARY_PATH=/opt/homebrew/lib.
    "pyacoustid==1.3.0",
    # The reference index is held as packed arrays (#315): ~165 MiB for the
    # library instead of 1.8 GiB of tuples, and vectorised stage-1 voting.
    "numpy==2.5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "fakeredis>=2.37.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
# `exclude_also` adds to coverage's defaults; `exclude_lines` would replace
# them and silently stop excluding `if TYPE_CHECKING:` blocks.
exclude_also = [
    # Entrypoint guards run under `python -m`, never under pytest.
    'if __name__ == "__main__":',
    "if __name__ == '__main__':",
]
