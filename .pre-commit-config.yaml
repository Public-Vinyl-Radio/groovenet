# Run these locally with:
#   uv tool install pre-commit   (or: pipx install pre-commit)
#   pre-commit install
#
# CI runs the same hooks over every file (.github/workflows/pre-commit.yml),
# so anything committed with --no-verify is still caught in the PR.
#
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Markdown uses two trailing spaces as a hard line break.
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^openapi-generated\.json$
      - id: check-yaml
      - id: check-json
        # tsconfig.json is JSONC — TypeScript allows comments, strict JSON does not.
        exclude: '(^|/)tsconfig(\..+)?\.json$'
      - id: check-toml
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(download-worker|ga-service|essentia-api|fingerprint-service|packages/groovenet-python)/
      # After ruff-check, so the formatter has the last word on its --fix output.
      - id: ruff-format
        files: ^(download-worker|ga-service|essentia-api|fingerprint-service|packages/groovenet-python)/

  # Each local hook runs ESLint from the directory that owns its flat config.
  # App and package filenames are filtered into separate hooks for mixed batches.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (my-collection-search)
        entry: bash -c 'cd my-collection-search && exec ./node_modules/.bin/eslint --fix --no-warn-ignored -- "${@#my-collection-search/}"' --
        language: system
        files: ^my-collection-search/.*\.(ts|tsx|js|jsx|mjs)$
        pass_filenames: true
      - id: eslint-groovenet-client
        name: eslint (groovenet-client)
        entry: bash -c 'cd packages/groovenet-client && exec ../../node_modules/.bin/eslint --fix --no-warn-ignored -- "${@#packages/groovenet-client/}"' --
        language: system
        files: ^packages/groovenet-client/.*\.(ts|tsx|js|jsx|mjs)$
        pass_filenames: true
      - id: eslint-groovenet-cli
        name: eslint (groovenet-cli)
        entry: bash -c 'cd packages/groovenet-cli && exec ../../node_modules/.bin/eslint --fix --no-warn-ignored -- "${@#packages/groovenet-cli/}"' --
        language: system
        files: ^packages/groovenet-cli/.*\.(ts|tsx|js|jsx|mjs)$
        pass_filenames: true
      - id: eslint-mcp-server
        name: eslint (mcp-server)
        entry: bash -c 'cd mcp-server && exec ../node_modules/.bin/eslint --fix --no-warn-ignored -- "${@#mcp-server/}"' --
        language: system
        files: ^mcp-server/.*\.(ts|tsx|js|jsx|mjs)$
        pass_filenames: true

  # After ESLint --fix, so Prettier lays out whatever ESLint rewrote.
  # eslint-config-prettier turns off ESLint's layout rules, so neither undoes
  # the other. Skips .prettierignore entries and file types Prettier can't parse.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: ./node_modules/.bin/prettier --write --ignore-unknown --log-level=warn
        language: system
        types: [text]
        pass_filenames: true
