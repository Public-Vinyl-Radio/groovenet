# Run these locally with:
#   uv tool install pre-commit   (or: pipx install pre-commit)
#   pre-commit install
#
# CI runs the same hooks over every file (.github/workflows/pre-commit.yml),
# so anything committed with --no-verify is still caught in the PR.
#
# packages/groovenet-python is generated by `just generate-python-client`;
# linting it would be undone on the next regeneration, so it is excluded
# everywhere below.
exclude: '^packages/groovenet-python/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Markdown uses two trailing spaces as a hard line break.
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
      - id: check-json
        # tsconfig.json is JSONC — TypeScript allows comments, strict JSON does not.
        exclude: '(^|/)tsconfig(\..+)?\.json$'
      - id: check-toml
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(download-worker|ga-service|essentia-api|fingerprint-service)/

  # eslint runs through the local install so it picks up
  # my-collection-search/eslint.config.mjs. packages/* and mcp-server have no
  # eslint config of their own yet, so they are not covered here.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (my-collection-search)
        # pre-commit passes repo-relative paths, but eslint has to run from
        # my-collection-search to find eslint.config.mjs — so cd there and
        # strip the prefix off each filename.
        entry: bash -c 'cd my-collection-search && exec npx eslint --fix --no-warn-ignored "${@#my-collection-search/}"' --
        language: system
        files: ^my-collection-search/.*\.(ts|tsx|js|jsx|mjs)$
        pass_filenames: true
