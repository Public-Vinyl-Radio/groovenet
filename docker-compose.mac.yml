# macOS-specific overrides (Apple Silicon / Docker Desktop)
# Applied automatically by `just compose-dev` when running on macOS.

services:
  app:
    platform: linux/arm64

  essentia:
    platform: linux/arm64

  ga-service:
    platform: linux/arm64

  download-worker:
    platform: linux/arm64

  gamdl-wrapper:
    image: ${GAMDL_WRAPPER_IMAGE:-wrapper-v2:1.0.0-local-arm64}
    platform: ${GAMDL_WRAPPER_PLATFORM:-linux/arm64}
