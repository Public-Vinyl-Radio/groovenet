# Unchanged components keep their last coverage report when CI skips them.
flag_management:
  default_rules:
    carryforward: true

flags:
  webapp:
    paths:
      - my-collection-search/
  groovenet-client:
    paths:
      - packages/groovenet-client/
  groovenet-cli:
    paths:
      - packages/groovenet-cli/
  npm-toolchain:
    paths:
      - scripts/check-npm-toolchain.mjs
  download-worker:
    paths:
      - download-worker/
  ga-service:
    paths:
      - ga-service/
  fingerprint-service:
    paths:
      - fingerprint-service/
  ci-changes:
    paths:
      - .github/scripts/ci-changes.mjs
